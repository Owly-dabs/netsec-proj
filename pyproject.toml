[project]
name = "swatad"
version = "0.1.0"
description = "Reproducing ML attack detectors (USAD, GDN) on SWaT/WADI"
requires-python = ">=3.10"
dependencies = [
    "torch==2.3.1",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pyarrow==16.1.0",
    "scikit-learn==1.5.0",
    "openpyxl==3.1.3",
    "matplotlib==3.9.0",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
